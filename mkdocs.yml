site_name: Unified API for Vaadin UI tests
site_url: https://parttio.github.io/unified-testing-tool/
repo_url: https://github.com/parttio/unified-testing-tool
repo_name: parttio/unified-testing-tool
edit_uri: ""

# Staged by scripts/build-docs.sh from README.md, GLOSSARY.md and docs/.
# Code snippets (--8<--) are included from the repository root.
docs_dir: target/docs-src
site_dir: target/site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
      check_paths: true
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

