name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browserless:
    name: Browserless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # full history, so the run summary can diff against the pull request's base ("Changed in this PR")
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests and demo tests on Browserless
        run: mvn -B -ntp install
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-browserless
          path: '**/target/surefire-reports/'
      # summary.md and every test's User Steps and failure evidence, passed or failed
      - name: Upload Unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-evidence-browserless
          path: '**/target/surefire-reports/unified-evidence/'
          if-no-files-found: ignore

  playwright:
    name: Playwright (Dramafinder)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # full history, so the run summary can diff against the pull request's base ("Changed in this PR")
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build without tests
        run: mvn -B -ntp install -DskipTests
      - name: Install Chromium for Playwright
        run: >
          mvn -B -ntp -pl unified-test-demo exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"
      - name: Demo tests on Playwright
        # a failed test keeps Playwright's trace, grouped by User Step, in the evidence artifact
        run: mvn -B -ntp -pl unified-test-demo test -Dvaadin.testing.tool=playwright -Dvaadin.testing.playwright.trace=on-failure
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-playwright
          path: '**/target/surefire-reports/'
      # summary.md and every test's User Steps and failure evidence, passed or failed
      - name: Upload Unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-evidence-playwright
          path: '**/target/surefire-reports/unified-evidence/'
          if-no-files-found: ignore

  selenium:
    name: Selenium (TestBench)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # TestBench checks its license when it loads (Vaadin Commercial License)
      VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_OFFLINE_KEY }}
    steps:
      # full history, so the run summary can diff against the pull request's base ("Changed in this PR")
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build without tests
        run: mvn -B -ntp install -DskipTests
      - name: Demo tests on Selenium (installed Chrome, driver from Selenium Manager)
        run: mvn -B -ntp -pl unified-test-demo test -Dvaadin.testing.tool=selenium
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-selenium
          path: '**/target/surefire-reports/'
      # summary.md and every test's User Steps and failure evidence, passed or failed
      - name: Upload Unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-evidence-selenium
          path: '**/target/surefire-reports/unified-evidence/'
          if-no-files-found: ignore
