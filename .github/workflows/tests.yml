# PROTOTYPE (#302), never merged: a rough measurement of a Unified UI Test against its Direct Test, per Testing Tool.
name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_OFFLINE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp install -DskipTests
      - name: Classpath
        working-directory: unified-test-demo
        run: mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=cp.txt && mvn -B -ntp -q test-compile
      - name: Benchmark (Selenium)
        working-directory: unified-test-demo
        run: |
          CP="target/test-classes:target/classes:$(cat cp.txt)"
          for i in 1 2; do
            java -Dvaadin.testing.tool=selenium -cp "$CP" ../prototype-302/Bench302.java 26 demo.ProfileTestBenchTest demo.ProfileMigratedTest > selenium-$i.out 2> selenium-$i.err || true
            grep ^BENCH selenium-$i.err > selenium-$i.csv || true
            echo "== run $i: rows per test and status"; cut -d, -f3,4,5 selenium-$i.csv | sort | uniq -c
            echo "== run $i: first errors"; grep -v '^BENCH' selenium-$i.err | grep -E "Exception|Error|at demo|Caused" | head -40
          done
          for i in 1 2; do
            python3 -I ../prototype-302/an302.py selenium-$i.csv ProfileTestBenchTest ProfileMigratedTest savesTheProfile || true
            python3 -I ../prototype-302/an302.py selenium-$i.csv ProfileTestBenchTest ProfileMigratedTest savesTheProfile se-launch || true
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-302
          path: |
            unified-test-demo/*.csv
            unified-test-demo/*.err
