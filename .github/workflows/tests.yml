name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # to download the base branch's last evidence, for the User Steps diff in the run summary
  actions: read

jobs:
  browserless:
    name: Browserless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # full history, so the run summary can diff against the pull request's base ("Changed in this PR")
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - name: Download the base branch's last User Steps
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-base-user-steps.sh unified-evidence-browserless "$RUNNER_TEMP/base-user-steps"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests and demo tests on Browserless
        run: mvn -B -ntp install -Dvaadin.testing.user-steps.baseline-dir="$RUNNER_TEMP/base-user-steps"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-browserless
          path: '**/target/surefire-reports/'
      # summary.md and every test's User Steps and failure evidence, passed or failed
      - name: Upload Unified evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-evidence-browserless
          path: '**/target/surefire-reports/unified-evidence/'
          if-no-files-found: ignore

  playwright:
    name: Playwright (Dramafinder)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # full history, so the run summary can diff against the pull request's base ("Changed in this PR")
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - name: Download the base branch's last User Steps
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-base-user-steps.sh unified-evidence-playwright "$RUNNER_TEMP/base-user-steps"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build without tests
        run: mvn -B -ntp install -DskipTests
      # the adapter downloads the browser itself, on the run's first test
      - name: Install the libraries Chromium needs
        run: >
          mvn -B -ntp -pl unified-test-demo exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install-deps chromium"
      - name: Demo tests on Playwright
        # a failed test keeps Playwright's trace, grouped by User Step, in the evidence artifact
        run: mvn -B -ntp -pl unified-test-demo test -Dvaadin.testing.tool=playwright -Dvaadin.testing.playwright.trace=on-failure -Dvaadin.testing.user-steps.baseline-dir="$RUNNER_TEMP/base-user-steps"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-playwright
          path: '**/target/surefire-reports/'
      # summary.md and every test's User Steps and failure evidence, passed or failed
      - name: Upload Unified evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-evidence-playwright
          path: '**/target/surefire-reports/unified-evidence/'
          if-no-files-found: ignore

  selenium:
    name: Selenium (TestBench)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # TestBench checks its license when it loads (Vaadin Commercial License)
      VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_OFFLINE_KEY }}
    steps:
      # full history, so the run summary can diff against the pull request's base ("Changed in this PR")
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - name: Download the base branch's last User Steps
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-base-user-steps.sh unified-evidence-selenium "$RUNNER_TEMP/base-user-steps"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build without tests
        run: mvn -B -ntp install -DskipTests
      - name: Demo tests on Selenium (installed Chrome, driver from Selenium Manager)
        run: mvn -B -ntp -pl unified-test-demo test -Dvaadin.testing.tool=selenium -Dvaadin.testing.user-steps.baseline-dir="$RUNNER_TEMP/base-user-steps"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-selenium
          path: '**/target/surefire-reports/'
      # summary.md and every test's User Steps and failure evidence, passed or failed
      - name: Upload Unified evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-evidence-selenium
          path: '**/target/surefire-reports/unified-evidence/'
          if-no-files-found: ignore

  # after the three: where the same scenarios end differently, or take different User Steps, on two Testing Tools
  compare:
    name: Compare Testing Tools
    needs: [browserless, playwright, selenium]
    # also when a job failed: that is when the comparison says most
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download the three jobs' Unified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        # a job that got no further than its build uploaded none: the comparison leaves it out
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'unified-evidence-*' --dir "$RUNNER_TEMP/evidence" || true
      - name: Build the Unified API
        run: mvn -B -ntp -q compile -pl unified-test-api -am
      - name: Compare the runs
        # exit code 2: fewer than two Testing Tools left evidence, which the jobs above already show as failed
        run: >
          java -cp unified-test-api/target/classes com.vaadin.testing.unified.report.CompareRuns
          "$RUNNER_TEMP/evidence/unified-evidence-browserless"
          "$RUNNER_TEMP/evidence/unified-evidence-playwright"
          "$RUNNER_TEMP/evidence/unified-evidence-selenium"
          || [ $? -eq 2 ]
